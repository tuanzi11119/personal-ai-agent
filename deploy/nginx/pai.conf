# Nginx site for the Personal AI Agent Platform.
# Save as /etc/nginx/sites-available/pai, symlink into sites-enabled, replace
# twin.example.com with your domain, then run certbot.
# The app listens on :3000 (docker compose publishes it).

server {
    listen 80;
    listen [::]:80;
    server_name twin.example.com;

    # certbot --nginx adds the 443 server block and certificate lines.
    # If you configure HTTPS by hand, add:
    #   listen 443 ssl http2;
    #   ssl_certificate     /etc/letsencrypt/live/twin.example.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/twin.example.com/privkey.pem;

    client_max_body_size 12m;          # MAX_UPLOAD_MB=10 plus multipart overhead

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # LLM answers can take up to LLM_TIMEOUT_SECONDS (60s) plus overhead.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering       off;
    }
}
